services:
  mysql:
    image: mysql:8.4
    container_name: yoj-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yoj
    ports:
      - "3306:3306"
    volumes:
      - yoj-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: yoj-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - yoj-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    container_name: yoj-rabbitmq
    hostname: yoj-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-yoj}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-yoj-dev-password}
    ports:
      - "5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - yoj-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  yoj-mysql-data:
  yoj-redis-data:
  yoj-rabbitmq-data:
